<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taskflow</title>
    <!--
      Resolve the theme before first paint so a reload never flashes the wrong
      palette or a white screen in dark mode. Mirrors src/hooks/useTheme.js —
      keep the storage keys, palette list and migration in sync with
      src/constants/storage.js and src/constants/themes.js.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var PALETTES = ["midnight", "ocean", "forest", "sunset"];
          var palette = localStorage.getItem("todo_mgr_theme_v1");
          var mode = localStorage.getItem("todo_mgr_theme_mode_v1");

          if (!mode) {
            // Pre-v2 single-value setting, or a brand new visitor.
            if (palette === "daylight") { palette = "midnight"; mode = "light"; }
            else if (PALETTES.indexOf(palette) !== -1) { mode = "dark"; }
            else { mode = "system"; }
          }
          if (PALETTES.indexOf(palette) === -1) palette = "midnight";

          root.dataset.theme = palette;
          root.dataset.mode = mode === "system"
            ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
            : mode;
        } catch (e) {
          root.dataset.theme = "midnight";
          root.dataset.mode = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
