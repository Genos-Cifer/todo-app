<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taskflow</title>
    <!--
      Set the theme attribute before first paint so reloading (or switching
      to/from the light "Daylight" theme) doesn't flash the wrong colors.
      Keep the storage key below in sync with THEME_STORAGE_KEY in
      src/constants/storage.js.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("todo_mgr_theme_v1");
          document.documentElement.dataset.theme = theme || "midnight";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
